name: Copia diaria

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, de madrugada en Valencia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copia
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar configuración
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$AGE_RECIPIENT" ]; then
            echo "::error::Faltan el secreto SUPABASE_DB_URL o la variable AGE_RECIPIENT (ver README)."
            exit 1
          fi

      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      # Datos de los esquemas public (la aplicación) y auth (usuarios del panel). El
      # esquema se reconstruye con las migraciones del repositorio Yerga-rest.
      - name: Volcado cifrado
        run: |
          set -euo pipefail
          trabajo="$(mktemp -d)"
          npx -y supabase@2.120.0 db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -s public,auth -f "$trabajo/datos.sql"
          mkdir -p copias
          nombre="copias/yerga-$(date -u +%Y-%m-%d).tar.gz.age"
          tar czf - -C "$trabajo" datos.sql | age -r "$AGE_RECIPIENT" > "$nombre"
          rm -rf "$trabajo"
          echo "Copia: $nombre ($(du -h "$nombre" | cut -f1))"

      - name: Borrar copias de más de 30 días
        run: |
          limite="$(date -u -d '30 days ago' +%Y-%m-%d)"
          for f in copias/yerga-*.tar.gz.age; do
            fecha="$(basename "$f" | sed -E 's/yerga-([0-9-]{10}).*/\1/')"
            if [[ "$fecha" < "$limite" ]]; then git rm -q "$f"; echo "Borrada $f"; fi
          done

      - name: Guardar
        run: |
          git config user.name "copia-yerga"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add copias
          git commit -q -m "Copia $(date -u +%Y-%m-%d)" || echo "Sin cambios"
          git push -q
